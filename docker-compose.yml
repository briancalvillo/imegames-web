# IME Games · web estática. Contenedor propio, solo accesible desde el servidor (127.0.0.1:8082);
# el Caddy común de /opt/projects/caddy hace de proxy con HTTPS (ver Caddyfile.ejemplo).
services:
  web:
    image: nginx:1.27-alpine
    container_name: imegames-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
